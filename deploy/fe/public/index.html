<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>G2P · Dual-Engine Agent</title>
  <style>
    :root {
      --black: #000000;
      --black-soft: #0a0a0a;
      --panel: #0d0d0d;
      --panel-2: #111111;
      --gold: #d4af37;
      --gold-bright: #f0d78c;
      --gold-deep: #9a7b2f;
      --platinum: #e8e6e1;
      --platinum-gold: #c9b896;
      --platinum-bright: #f5f2ea;
      --muted: #8a8070;
      --line: #3d3420;
      --line-gold: #a0893a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(900px 420px at 10% -10%, rgba(212, 175, 55, 0.12), transparent 55%),
        radial-gradient(700px 380px at 100% 0%, rgba(201, 184, 150, 0.08), transparent 50%),
        var(--black);
      color: var(--platinum);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    /* Metallic gold lettering */
    .gold-text {
      background: linear-gradient(
        165deg,
        #fff8e0 0%,
        #f0d78c 18%,
        #d4af37 42%,
        #a67c00 58%,
        #f5e6a8 78%,
        #c9a227 100%
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-stroke: 0.6px rgba(232, 230, 225, 0.55);
      filter: drop-shadow(0 0 12px rgba(212, 175, 55, 0.25));
      font-weight: 800;
      letter-spacing: 0.08em;
    }
    .gold-outline {
      border: 1px solid transparent;
      border-radius: 16px;
      background:
        linear-gradient(var(--panel), var(--panel)) padding-box,
        linear-gradient(135deg, #f5f2ea, #d4af37, #8a7340, #e8e6e1, #c9a227) border-box;
      box-shadow:
        0 0 0 1px rgba(212, 175, 55, 0.15),
        inset 0 1px 0 rgba(245, 242, 234, 0.08);
    }
    header {
      border-bottom: 1px solid var(--line-gold);
      padding: 0.9rem 1.15rem;
      display: flex;
      gap: 0.75rem;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      background: linear-gradient(180deg, #0a0a0a, #000);
    }
    h1 {
      font-size: 1.05rem;
      margin: 0;
      display: flex;
      align-items: baseline;
      gap: 0.45rem;
    }
    h1 .mark {
      font-size: 1.25rem;
    }
    .badge {
      font-size: 0.68rem;
      color: var(--platinum-gold);
      border: 1px solid var(--line-gold);
      padding: 0.22rem 0.55rem;
      border-radius: 999px;
      background: rgba(212, 175, 55, 0.06);
    }
    .badge.ok {
      color: var(--gold-bright);
      border-color: var(--gold);
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
    }
    main {
      flex: 1;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      min-height: 0;
    }
    #thread {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      padding-bottom: 0.5rem;
      min-height: 280px;
    }
    .msg {
      border-radius: 14px;
      padding: 0.75rem 0.9rem;
      max-width: 92%;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.88rem;
      line-height: 1.45;
      background: var(--panel);
      border: 1px solid var(--line);
    }
    .msg.user {
      align-self: flex-end;
      background: #12100a;
      border-color: var(--line-gold);
      box-shadow: 0 0 16px rgba(212, 175, 55, 0.08);
    }
    .msg.bot {
      align-self: flex-start;
      border-color: #2a2418;
    }
    .msg .who {
      font-size: 0.65rem;
      color: var(--gold);
      margin-bottom: 0.35rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .composer {
      padding: 0.85rem;
    }
    textarea {
      width: 100%;
      min-height: 72px;
      resize: vertical;
      background: var(--black-soft);
      color: var(--platinum-bright);
      border: 1px solid var(--line-gold);
      border-radius: 12px;
      padding: 0.7rem;
      font: inherit;
      outline: none;
    }
    textarea:focus {
      box-shadow: 0 0 0 1px var(--gold), 0 0 18px rgba(212, 175, 55, 0.2);
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      margin-top: 0.55rem;
    }
    /* Platinum-gold metallic buttons */
    button.primary {
      background: linear-gradient(
        165deg,
        #f5f2ea 0%,
        #e8d5a3 22%,
        #d4af37 48%,
        #a0893a 70%,
        #e6d19a 100%
      );
      color: #0a0800;
      border: 1px solid #f0e6c8;
      border-radius: 999px;
      padding: 0.58rem 1.15rem;
      font-weight: 800;
      cursor: pointer;
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      box-shadow:
        0 0 0 1px rgba(232, 230, 225, 0.35),
        0 4px 16px rgba(212, 175, 55, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.45);
    }
    button.primary:hover {
      filter: brightness(1.06);
    }
    button.primary:disabled {
      opacity: 0.5;
      cursor: wait;
      filter: none;
    }
    button.ghost {
      background: transparent;
      color: var(--platinum-gold);
      border: 1px solid var(--line-gold);
      border-radius: 999px;
      padding: 0.55rem 1rem;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.82rem;
      box-shadow: inset 0 0 0 1px rgba(232, 230, 225, 0.08);
    }
    button.ghost:hover {
      background: rgba(212, 175, 55, 0.08);
      color: var(--gold-bright);
    }
    label.chk {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.75rem;
      color: var(--muted);
    }
    #status { font-size: 0.72rem; color: var(--muted); margin-top: 0.2rem; }
    a.badge { text-decoration: none; color: var(--platinum-gold); }
    a.badge:hover { color: var(--gold-bright); border-color: var(--gold); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(var(--gold-deep), var(--gold));
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>
        <span class="gold-text mark">G2P</span>
        <span class="gold-text" style="font-size:0.95rem;font-weight:700;letter-spacing:0.12em">AGENT</span>
      </h1>
      <div id="status">Dual-engine · black & gold</div>
    </div>
    <div class="row">
      <span class="badge" id="health-badge">—</span>
      <a class="badge" href="/metrics.html">Metrics</a>
    </div>
  </header>
  <main>
    <div id="thread"></div>
    <div class="composer gold-outline">
      <textarea id="q" placeholder="Ask G2P — math, life, build… or generate a video of ocean sunset"></textarea>
      <div class="row">
        <label class="chk"><input type="checkbox" id="verify" /> Verify engine</label>
        <button type="button" class="primary" id="send">Send</button>
        <button type="button" class="ghost" id="clear">Clear</button>
      </div>
    </div>
  </main>
  <script>
    const KEY = "g2p-edge-chat-v1";
    const thread = document.getElementById("thread");
    const q = document.getElementById("q");
    let busy = false;

    function load() {
      try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch { return []; }
    }
    function save(msgs) {
      localStorage.setItem(KEY, JSON.stringify(msgs.slice(-80)));
    }
    function render() {
      const msgs = load();
      thread.innerHTML = "";
      if (!msgs.length) {
        const d = document.createElement("div");
        d.className = "msg bot gold-outline";
        d.innerHTML = '<div class="who">G2P</div>Dual-engine ready: draft → refine. Video uses Director + RunPod when keys are set. Ask anything.';
        thread.appendChild(d);
        return;
      }
      for (const m of msgs) {
        const d = document.createElement("div");
        d.className = "msg " + (m.role === "user" ? "user" : "bot");
        if (m.role === "bot") d.classList.add("gold-outline");
        d.innerHTML = '<div class="who">' + (m.role === "user" ? "You" : "G2P") +
          (m.meta ? " · " + m.meta : "") + "</div>" +
          escapeHtml(m.content);
        thread.appendChild(d);
      }
      thread.scrollTop = thread.scrollHeight;
    }
    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&")
        .replace(/</g, "<")
        .replace(/>/g, ">");
    }

    async function j(url, opts) {
      const r = await fetch(url, opts);
      const t = await r.text();
      try { return JSON.parse(t); } catch { return { raw: t, status: r.status }; }
    }

    async function refreshHealth() {
      try {
        const h = await j("/api/health");
        const b = document.getElementById("health-badge");
        b.textContent = "G2P · " + (h.host || "be") + " · " + (h.engineRole || "ok");
        b.className = "badge ok";
        document.getElementById("status").textContent =
          "G2P dual-engine online · pipeline + video";
      } catch (e) {
        document.getElementById("health-badge").textContent = "offline";
        document.getElementById("status").textContent = "Start: deploy\\\\start-cluster.ps1";
      }
    }

    async function send() {
      const text = q.value.trim();
      if (!text || busy) return;
      busy = true;
      document.getElementById("send").disabled = true;
      const msgs = load();
      msgs.push({ role: "user", content: text });
      save(msgs);
      q.value = "";
      render();

      try {
        const verify = document.getElementById("verify").checked;
        const r = await j("/api/pipeline", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text, verify, autoVideo: true }),
        });
        const meta = [
          r.mode || "",
          r.draftHost && r.refineHost ? r.draftHost + "→" + r.refineHost : "",
          r.quality != null ? "q=" + r.quality : "",
          r.ms != null ? r.ms + "ms" : "",
          r.verified ? "verified" : "",
          r.video && r.video.jobId ? "job " + r.video.jobId : "",
        ].filter(Boolean).join(" · ");
        msgs.push({
          role: "bot",
          content: r.content || JSON.stringify(r, null, 2),
          meta,
        });
        save(msgs);
      } catch (e) {
        msgs.push({ role: "bot", content: "Error: " + e, meta: "error" });
        save(msgs);
      }
      render();
      busy = false;
      document.getElementById("send").disabled = false;
      q.focus();
    }

    document.getElementById("send").onclick = send;
    document.getElementById("clear").onclick = () => {
      localStorage.removeItem(KEY);
      render();
    };
    q.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });
    render();
    refreshHealth();
    setInterval(refreshHealth, 10000);
  </script>
</body>
</html>
