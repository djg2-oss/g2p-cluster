# Agent G2P dual-engine cluster + optional Engine-V
# 2 FE + 2 BE (draft/refine) + optional BE-V (verify) + LB
# Usage: docker compose up -d

services:
  be1:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      HOST_ID: be-1
      PORT: 3001
      ENGINE_ROLE: draft
      PEER_URL: http://be2:3002
      VERIFY_URL: http://bev:3003
      PIPELINE_CACHE_TTL_MS: "120000"
    command: ["node", "src/server/backend.mjs"]
    restart: unless-stopped
    expose:
      - "3001"

  be2:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      HOST_ID: be-2
      PORT: 3002
      ENGINE_ROLE: refine
      PEER_URL: http://be1:3001
      VERIFY_URL: http://bev:3003
      PIPELINE_CACHE_TTL_MS: "120000"
    command: ["node", "src/server/backend.mjs"]
    restart: unless-stopped
    expose:
      - "3002"

  # Phase C — optional third engine (verify-only)
  bev:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      HOST_ID: be-v
      PORT: 3003
      ENGINE_ROLE: verify
      PEER_URL: ""
      PIPELINE_CACHE_TTL_MS: "60000"
    command: ["node", "src/server/backend.mjs"]
    restart: unless-stopped
    expose:
      - "3003"

  fe1:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      HOST_ID: fe-1
      PORT: 5173
    command: ["node", "deploy/fe/static-server.mjs"]
    restart: unless-stopped
    expose:
      - "5173"

  fe2:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      HOST_ID: fe-2
      PORT: 5174
    command: ["node", "deploy/fe/static-server.mjs"]
    restart: unless-stopped
    expose:
      - "5174"

  lb:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      LB_PORT: 8080
      BACKENDS: http://be1:3001,http://be2:3002
      FRONTENDS: http://fe1:5173,http://fe2:5174
    command: ["node", "deploy/lb/proxy.mjs"]
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - be1
      - be2
      - bev
      - fe1
      - fe2
